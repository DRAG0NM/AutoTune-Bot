name: Validate

on: [push, pull_request]

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - run: npm test
      - run: node bridge/cli.js selftest --json
      - run: npm run verify:evidence
      - run: npm run verify:history
      - run: npm run verify:submission
      - run: npm run audit:sessions
      - run: npm run plot:evidence
