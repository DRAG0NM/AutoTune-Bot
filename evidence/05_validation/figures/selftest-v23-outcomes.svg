<text class="small muted" text-anchor="middle" x="617.5" y="101">0.4</text>
<line class="grid" x1="748.75" x2="748.75" y1="110" y2="466"/>
<text class="small muted" text-anchor="middle" x="748.75" y="101">0.6</text>
<line class="grid" x1="880" x2="880" y1="110" y2="466"/>
<text class="small muted" text-anchor="middle" x="880" y="101">0.8</text>
<text class="small" text-anchor="end" x="339" y="134">normal-tuned</text>
<circle cx="452.846875" cy="130" r="6" fill="#25826e"/>
<text class="small muted" x="462.846875" y="134">J=0.1491</text>
<text class="small muted" x="930" y="134">收敛 | ok</text>
