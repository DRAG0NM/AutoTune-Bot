<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="571" viewBox="0 0 1100 571" role="img" aria-labelledby="title desc">
<title id="title">v2.3 selftest case outcomes</title>
<desc id="desc">Nine selftest cases shown by objective J where finite, with distinct markers for converged, non-converged, and expected hard-fall cases. The selftest suite passed all expected assertions.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>svg{fill:#202a35}text{font-family:Arial,"Microsoft YaHei",sans-serif}.muted{fill:#596776}.grid{stroke:#d8dee5;stroke-width:1}.axis{stroke:#202a35;stroke-width:1.2}.small{font-size:13px}.label{font-size:15px}.title{font-size:22px;font-weight:700}.subtitle{font-size:14px}.panel-title{font-size:16px;font-weight:700}</style>
<text class="title" x="40" y="40">v2.3 selftest | 9 个行为样例</text>
<text class="subtitle muted" x="40" y="65">allPass=true；横轴为综合代价 J；右侧为收敛状态及运行结果。</text>
<line class="axis" x1="355" x2="880" y1="110" y2="110"/>
