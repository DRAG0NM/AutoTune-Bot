<title id="title">D2-T autonomous search trajectories</title>
<desc id="desc">Three independent search campaigns show J by search evaluation. Circles are converged points, triangles are non-converged points, and a ring highlights each campaign best feasible point. Validation success counts are shown separately.</desc>
